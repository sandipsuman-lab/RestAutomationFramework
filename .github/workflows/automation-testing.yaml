name: API Automation Testing

# Reusable workflow, invoked by other repositories:
#   jobs:
#     api-tests:
#       uses: <org>/RestAutomationFramework/.github/workflows/automation-testing.yaml@master
#       with: { feature_tag: "@Places and @smoke", release_version: "1.4.0", cycle_name: "Sprint-42" }
#       secrets: inherit
on:
  workflow_call:
    inputs:
      feature_tag:
        description: Cucumber tag expression, e.g. "@Places and @smoke"
        required: true
        type: string
      release_version:
        required: true
        type: string
      cycle_name:
        required: true
        type: string
      profile:
        description: Spring profile (local, stage)
        required: false
        type: string
        default: local
      threads:
        description: Parallel scenario threads
        required: false
        type: string
        default: "1"
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: false
      SNOWFLAKE_USER:
        required: false
      SNOWFLAKE_PASSWORD:
        required: false

jobs:
  api-tests:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - name: Checkout automation framework
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RestAutomationFramework
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API tests
        run: >
          ./mvnw -B clean verify
          -Dmaven.test.failure.ignore=true
          -Dspring.profiles.active=${{ inputs.profile }}
          -Dcucumber.filter.tags="${{ inputs.feature_tag }}"
          -Dthreads=${{ inputs.threads }}
          -DQARELEASEVERSION="${{ inputs.release_version }}"
          -DQATESTCYCLE="${{ inputs.cycle_name }}"

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-${{ github.run_id }}
          path: |
            target/cucumber-reports/
            target/data-validation/
            reports/
            Logs/

      - name: Fail job when tests failed
        if: always()
        run: |
          f=target/surefire-reports/testng-results.xml
          if [ ! -f "$f" ]; then
            echo "::error::No test results found - the build or test run did not complete"; exit 1
          fi
          # TestNG writes failed="N" (not failures=), so match that attribute on the root element.
          if grep -q 'failed="[1-9]' "$f"; then
            echo "::error::API tests failed - see the uploaded reports"; exit 1
          fi
